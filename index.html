<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramachandra Murthy - Portfolio</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- This tells the browser exactly how to load React natively without Babel crashing -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
      }
    }
  </script>
  
  <!-- Babel standalone for compiling JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Notice data-type="module" - this fixes the module error! -->
  <script type="text/babel" data-type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';

    const SVGIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );

    const Briefcase = (p) => <SVGIcon {...p}><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></SVGIcon>;
    const GraduationCap = (p) => <SVGIcon {...p}><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></SVGIcon>;
    const LineChart = (p) => <SVGIcon {...p}><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></SVGIcon>;
    const Mail = (p) => <SVGIcon {...p}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></SVGIcon>;
    const MapPin = (p) => <SVGIcon {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></SVGIcon>;
    const Phone = (p) => <SVGIcon {...p}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></SVGIcon>;
    const User = (p) => <SVGIcon {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></SVGIcon>;
    const ChevronRight = (p) => <SVGIcon {...p}><path d="m9 18 6-6-6-6"/></SVGIcon>;
    const Linkedin = (p) => <SVGIcon {...p}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></SVGIcon>;
    const Award = (p) => <SVGIcon {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></SVGIcon>;
    const BookOpen = (p) => <SVGIcon {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></SVGIcon>;
    const Download = (p) => <SVGIcon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></SVGIcon>;
    const ExternalLink = (p) => <SVGIcon {...p}><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></SVGIcon>;
    const Github = (p) => <SVGIcon {...p}><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></SVGIcon>;
    const Layers = (p) => <SVGIcon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></SVGIcon>;
    const Folder = (p) => <SVGIcon {...p}><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></SVGIcon>;

    const App = () => {
      const [activeTab, setActiveTab] = useState('about');
      const [copied, setCopied] = useState(false);

      const personalInfo = {
        name: "Ramachandra Murthy Mamidipalli",
        title: "MBA | Business Analytics",
        tagline: "Bridging analytical rigor with strategic insights to drive business growth.",
        email: "subramanyaramachandramurthy@gmail.com",
        phone: "+91 9390692684",
        location: "Mummidivaram, India",
        linkedin: "https://www.linkedin.com/in/ramachandra-murthy-mamidipalli-85a67a208/",
        github: "https://github.com/MurthyMamidipalli", 
        resume: "https://drive.google.com/file/d/11XRzxeEpef4wzUI1rgozVNRIVRK8-kn-/view?usp=drive_link" 
      };

      const education = [
        {
          degree: "Master of Business Administration (MBA)",
          institution: "Amity University",
          year: "2025 - 2027",
          details: "Specialization in Business Analytics.",
          gpa: "8.41/10"
        },
        {
          degree: "Bachelor of Technology in Computer Science and Engineering",
          institution: "KL University",
          year: "2019 - 2024",
          details: "Specialization in Cloud & Edge Computing.",
          gpa: "7.28/10"
        }
      ];

      const experience = [
        {
          role: "Product Management Intern",
          company: "Stealth Startup",
          duration: "July 2025 - September 2025",
          achievements: [
            "Collaborated with founders, developers, and designers to build the product from ideation to MVP launch.",
            "Conducted user research and feedback sessions to define core features and user flows.",
            "Assisted in prioritizing product requirements, managing sprints, and coordinating daily stand-ups with cross-functional teams.",
            "Supported the go-to-market plan that helped the team acquire the first 100+ users for the MVP.",
            "Contributed to defining the product roadmap, UI/UX improvements, and early-stage growth strategies.",
          ]
        }
      ];

      const products = [
        {
          title: "redBus Teardown",
          type: "Product Teardown",
          description: "End-to-end product teardown of redBus — India's #1 bus aggregator — including original women's safety feature proposals with SOS, number masking, and proactive call architecture.",
          tools: ["Product Management", "Market Research"],
          link: "https://drive.google.com/file/d/15DYVJ5UtzU9JJgF4KDRrzwI8YDUDs770/view?usp=drive_link", 
          github: "https://github.com/MurthyMamidipalli/RedBus-Product-Teardown" 
        },
        {
          title: "Fitness Tracker",
          type: "Product",
          description: "Developed a fully responsive Fitness Tracker Web Application that allows users to monitor workouts, track calories, and analyze fitness progress through interactive dashboards.",
          tools: ["Fire Base Studio" , "Vercel"],
          link: "https://studio-three-opal.vercel.app/login", 
          github: "https://github.com/MurthyMamidipalli/studio" 
        }
      ];

      const projects = [
        {
          title: "Retail Sales and Profit Analysis Project",
          type: "Business Analytics",
          description: "Analyzed retail sales data containing orders, customers, products, sales, profit, and shipping information.",
          tools: ["Excel"],
          link: "https://drive.google.com/drive/folders/1VHgKrN4vHlZhYYCRk3LwMP2qFBwj88C4?usp=drive_link", 
        },
        {
          title: "E-Commerce Sales Analysis Project",
          type: "Business Analytics",
          description: "Analyzed 15,000+ e-commerce sales records to identify revenue, profit, and customer purchasing trends. Performed data cleaning by removing duplicates, handling missing values, and validating data formats for accurate analysis.",
          tools: ["Power BI", "Excel"],
          link: "https://drive.google.com/drive/folders/1xxJSd4i5QTeEhaOCu8nvBSc9UF2b6-g3?usp=drive_link",  
        }
      ];

      const skills = {
        "Technical Skills": ["Excel" , "SQL" , "Power BI"],
        "Analytical Skills": ["Data Cleaning", "Data Analysis", "Data Visualization"],
        "Tools": ["Advanced Excel",  "Power BI", "My SQL"],
        "Soft Skills": ["Communication" , "Leadership" , "Teamwork"],
        "Languages": ["English", "Telugu"]
      };

      const handleCopyEmail = (e) => {
        e.preventDefault();
        const textArea = document.createElement("textarea");
        textArea.value = personalInfo.email;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          setCopied(true);
          setTimeout(() => setCopied(false), 2000); 
        } catch (err) {
          console.error('Failed to copy', err);
        }
        document.body.removeChild(textArea);
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans">
          <header className="bg-slate-900 text-white py-20 px-6 sm:px-12 lg:px-24">
            <div className="max-w-4xl mx-auto flex flex-col items-center gap-8 text-center">
              <div className="w-48 h-48 sm:w-64 sm:h-64 rounded-full border-4 border-slate-700 overflow-hidden shadow-2xl shrink-0 bg-slate-800 flex items-center justify-center mb-2">
                 <img src="https://i.postimg.cc/Fz95060C/Professional-PIC.png" alt={personalInfo.name} className="w-full h-full object-cover object-top" />
              </div>
              <div className="flex-1 space-y-6 flex flex-col items-center">
                <h1 className="text-4xl sm:text-5xl font-extrabold tracking-tight">{personalInfo.name}</h1>
                <h2 className="text-xl sm:text-2xl text-blue-400 font-medium">{personalInfo.title}</h2>
                <p className="text-slate-300 text-lg max-w-2xl leading-relaxed">{personalInfo.tagline}</p>
                <div className="flex flex-wrap justify-center gap-4 pt-4">
                  <a href={personalInfo.resume} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-full transition-colors font-medium shadow-lg shadow-emerald-900/20">
                    <Download size={18} /> Resume
                  </a>
                  <button onClick={handleCopyEmail} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-full transition-colors font-medium cursor-pointer">
                    <Mail size={18} /> {copied ? "Email Copied!" : "Email Me"}
                  </button>
                  <a href={personalInfo.linkedin} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-5 py-2.5 rounded-full transition-colors font-medium">
                    <Linkedin size={18} /> LinkedIn
                  </a>
                  <a href={personalInfo.github} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-5 py-2.5 rounded-full transition-colors font-medium">
                    <Github size={18} /> GitHub
                  </a>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-6 sm:px-12 lg:px-24 py-16">
            <div className="flex overflow-x-auto space-x-2 sm:space-x-8 border-b border-slate-200 mb-12 pb-2 scrollbar-hide">
              {['about', 'experience', 'products', 'projects', 'education', 'skills'].map((tab) => (
                <button
                  key={tab}
                  onClick={() => setActiveTab(tab)}
                  className={`pb-3 text-sm sm:text-base font-semibold uppercase tracking-wider whitespace-nowrap transition-colors ${
                    activeTab === tab ? 'border-b-2 border-blue-600 text-blue-600' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  {tab}
                </button>
              ))}
            </div>

            <div className="min-h-[400px]">
              
              {}
              {activeTab === 'about' && (
                <div className="space-y-8 animate-fade-in">
                  <section className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                    <h3 className="text-2xl font-bold mb-4 flex items-center gap-2">
                      <User className="text-blue-600" /> Professional Summary
                    </h3>
                    <p className="text-slate-600 leading-relaxed text-lg">
                      I am a detail-oriented MBA candidate specializing in Business Analytics at Amity University, leveraging a strong technical foundation in Computer Science to bridge the gap between raw data and strategic decision-making. My academic background and hands-on project experiences have equipped me with the ability to extract, clean, and analyze complex datasets using tools like Python, SQL, and Power BI. I am passionate about uncovering actionable insights, building data models, and translating technical findings into clear business strategies. Currently seeking opportunities to apply my analytical rigor and data visualization expertise to solve real-world business challenges and deliver measurable value.
                    </p>
                  </section>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-start gap-4">
                      <div className="bg-blue-100 p-3 rounded-lg text-blue-600 mt-1"><MapPin size={24} /></div>
                      <div>
                        <h4 className="font-bold text-slate-800 mb-1">Location</h4>
                        <p className="text-slate-600">{personalInfo.location} (Open to relocate)</p>
                      </div>
                    </div>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-start gap-4">
                      <div className="bg-blue-100 p-3 rounded-lg text-blue-600 mt-1"><Phone size={24} /></div>
                      <div>
                        <h4 className="font-bold text-slate-800 mb-1">Phone</h4>
                        <p className="text-slate-600">{personalInfo.phone}</p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {}
              {activeTab === 'experience' && (
                <div className="space-y-8 animate-fade-in">
                  <h3 className="text-2xl font-bold mb-6 flex items-center gap-2"><Briefcase className="text-blue-600" /> Experience</h3>
                  <div className="space-y-6">
                    {experience.map((exp, index) => (
                      <div key={index} className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-1.5 h-full bg-blue-600"></div>
                        <div className="flex flex-col md:flex-row md:justify-between md:items-start mb-4 gap-2">
                          <div>
                            <h4 className="text-xl font-bold text-slate-900">{exp.role}</h4>
                            <p className="text-lg text-blue-600 font-medium">{exp.company}</p>
                          </div>
                          <span className="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-sm font-medium whitespace-nowrap">{exp.duration}</span>
                        </div>
                        <ul className="space-y-3 mt-4">
                          {exp.achievements.map((item, i) => (
                            <li key={i} className="flex items-start gap-3 text-slate-600">
                              <ChevronRight size={18} className="text-blue-500 mt-0.5 shrink-0" />
                              <span className="leading-relaxed">{item}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {}
              {activeTab === 'products' && (
                <div className="space-y-8 animate-fade-in">
                  <div className="mb-6">
                    <h3 className="text-2xl font-bold flex items-center gap-2"><Layers className="text-blue-600" /> Products & Teardowns</h3>
                    <p className="text-slate-500 mt-2">Product management case studies and application development.</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {products.map((product, index) => (
                      <div key={index} className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-full hover:shadow-md transition-shadow">
                        <div className="mb-4">
                          <span className="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2 py-1 rounded">{product.type}</span>
                        </div>
                        <h4 className="text-xl font-bold text-slate-900 mb-3">{product.title}</h4>
                        <p className="text-slate-600 leading-relaxed flex-grow mb-4">{product.description}</p>
                        
                        {product.tools && (
                          <div className="flex flex-wrap gap-2 mb-6">
                            {product.tools.map((tool, i) => (
                              <span key={i} className="px-2.5 py-1 bg-slate-100 text-slate-600 text-xs font-semibold rounded-md border border-slate-200">{tool}</span>
                            ))}
                          </div>
                        )}

                        <div className="flex flex-wrap gap-3 mt-auto self-start">
                          {product.link && (
                            <a href={product.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2 rounded-lg transition-colors font-medium text-sm">
                              View Product <ExternalLink size={16} />
                            </a>
                          )}
                          {product.github && (
                            <a href={product.github} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2 rounded-lg transition-colors font-medium text-sm">
                              Source Code <Github size={16} />
                            </a>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {}
              {activeTab === 'projects' && (
                <div className="space-y-8 animate-fade-in">
                  <div className="mb-6">
                    <h3 className="text-2xl font-bold flex items-center gap-2"><Folder className="text-blue-600" /> Academic & Analytics Projects</h3>
                    <p className="text-slate-500 mt-2">Key projects demonstrating practical application of data concepts.</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {projects.map((project, index) => (
                      <div key={index} className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-full hover:shadow-md transition-shadow">
                        <div className="mb-4">
                          <span className="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2 py-1 rounded">{project.type}</span>
                        </div>
                        <h4 className="text-xl font-bold text-slate-900 mb-3">{project.title}</h4>
                        <p className="text-slate-600 leading-relaxed flex-grow mb-4">{project.description}</p>
                        
                        {project.tools && (
                          <div className="flex flex-wrap gap-2 mb-6">
                            {project.tools.map((tool, i) => (
                              <span key={i} className="px-2.5 py-1 bg-slate-100 text-slate-600 text-xs font-semibold rounded-md border border-slate-200">{tool}</span>
                            ))}
                          </div>
                        )}

                        <div className="flex flex-wrap gap-3 mt-auto self-start">
                          {project.link && (
                            <a href={project.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2 rounded-lg transition-colors font-medium text-sm">
                              View Project <ExternalLink size={16} />
                            </a>
                          )}
                          {project.github && (
                            <a href={project.github} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2 rounded-lg transition-colors font-medium text-sm">
                              Source Code <Github size={16} />
                            </a>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {}
              {activeTab === 'education' && (
                <div className="space-y-8 animate-fade-in">
                  <h3 className="text-2xl font-bold mb-6 flex items-center gap-2"><GraduationCap className="text-blue-600" /> Education</h3>
                  <div className="space-y-6">
                    {education.map((edu, index) => (
                      <div key={index} className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start gap-4">
                        <div className="flex-1">
                          <h4 className="text-xl font-bold text-slate-900">{edu.degree}</h4>
                          <p className="text-lg text-slate-700 font-medium mt-1">{edu.institution}</p>
                          <p className="text-slate-600 mt-3 leading-relaxed">{edu.details}</p>
                        </div>
                        <div className="flex flex-col items-end gap-2 w-full md:w-auto mt-4 md:mt-0 pt-4 md:pt-0 border-t md:border-t-0 border-slate-100">
                          <span className="text-slate-500 font-medium">{edu.year}</span>
                          <span className="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-bold">GPA: {edu.gpa}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {}
              {activeTab === 'skills' && (
                <div className="space-y-8 animate-fade-in">
                  <h3 className="text-2xl font-bold mb-6 flex items-center gap-2"><Award className="text-blue-600" /> Competencies & Tools</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    {Object.entries(skills).map(([category, skillList], index) => (
                      <div key={category} className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                        <h4 className="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2 border-b border-slate-100 pb-3">
                          {index % 2 === 0 ? <BookOpen className="text-slate-400" size={20} /> : <LineChart className="text-slate-400" size={20} />} 
                          {category}
                        </h4>
                        <div className="flex flex-wrap gap-3">
                          {skillList.map((skill, idx) => (
                            <span key={idx} className={`px-4 py-2 rounded-lg font-medium ${index % 2 === 0 ? 'bg-slate-100 text-slate-700' : 'bg-blue-50 text-blue-700 border border-blue-100'}`}>
                              {skill}
                            </span>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </main>
          
          <footer className="bg-slate-900 text-slate-400 py-8 text-center">
            <p>© {new Date().getFullYear()} {personalInfo.name}. All rights reserved.</p>
          </footer>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
